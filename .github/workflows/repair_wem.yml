name: Repair Weekly Expected Move (run once)

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch database from data branch
        run: |
          git fetch --depth=1 origin data
          git cat-file blob FETCH_HEAD:spy_data.db > spy_data.db

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repair weekly_em and rescore against static bands
        run: python repair_wem.py

      - name: Rebuild exports
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python fetch_and_analyze.py

      - name: Push database to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin data
          BLOB=$(git hash-object -w spy_data.db)
          TREE=$(printf '100644 blob %s\tspy_data.db\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -p FETCH_HEAD -m "fix: weekly_em scored against static bands")
          git push origin "$COMMIT":refs/heads/data

      - name: Commit exports
        run: |
          git checkout -- spy_data.db
          git add -f spy_data.json market_data.json \
                     analog_data.js tod_stats.js \
                     intraday_library.js expiry_data.js \
                     intraday_patterns.js decline_data.js relief_data.js \
                     window_stats.js gap_stats.js \
                     session_vol_profile.js intraday_vol_profile.js intraday_vol_stats.js \
                     large_gap_stats.js release_data.js edge_stats_data.js \
                     data/SPY_weekly.csv data/SPY_monthly.csv data/SPY_yearly.csv
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: exports after weekly expected move repair"
          git pull --rebase --autostash origin main
          git push
