name: Sentiment Data Update

on:
  schedule:
    # Friday 3:00 UTC (Thursday 11:00 PM Eastern in winter, 10:00 PM in summer): after AAII's Thursday release
    - cron: '0 3 * * 5'
    # Saturday 0:00 UTC (Friday 8:00 PM Eastern in winter, 7:00 PM in summer): after the CFTC's Friday release
    - cron: '0 0 * * 6'
    # Monday 12:00 UTC backstop
    - cron: '0 12 * * 1'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: sentiment-update
  cancel-in-progress: false

jobs:
  fetch-sentiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          cache: 'pip'
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests xlrd

      - name: Fetch AAII + COT data
        run: python fetch_sentiment.py

      - name: Commit sentiment_data.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sentiment_data.json sentiment_history.json
          if git diff --staged --quiet; then
            echo "No changes to sentiment data"
            exit 0
          fi
          git commit -m "Auto: sentiment data update $(TZ=America/Chicago date +'%Y-%m-%d %H:%M %Z')"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs --autostash origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "Could not push after three attempts"
          exit 1
