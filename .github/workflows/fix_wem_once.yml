name: Fix WEM DB (run once)

on:
  workflow_dispatch:  # manual trigger only

jobs:
  fix-wem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch database from data branch
        run: |
          git fetch --depth=1 origin data
          git cat-file blob FETCH_HEAD:spy_data.db > spy_data.db

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show DB rows before fix
        run: |
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('spy_data.db')
          rows = conn.execute('SELECT week_start, week_end, dte, week_close, closed_inside FROM weekly_em WHERE week_start >= \"2026-04-06\" ORDER BY week_start').fetchall()
          print('BEFORE:')
          for r in rows:
              print(r)
          conn.close()
          "

      - name: Run WEM fix script
        run: python3 fix_wem_db.py

      - name: Show DB rows after fix
        run: |
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('spy_data.db')
          rows = conn.execute('SELECT week_start, week_end, dte, week_close, closed_inside FROM weekly_em WHERE week_start >= \"2026-04-06\" ORDER BY week_start').fetchall()
          print('AFTER:')
          for r in rows:
              print(r)
          conn.close()
          "

      - name: Show git status
        run: git status && git diff --stat

      - name: Push database to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin data
          BLOB=$(git hash-object -w spy_data.db)
          TREE=$(printf '100644 blob %s\tspy_data.db\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -p FETCH_HEAD -m "fix: correct bad WEM rows from Thursday short-week bug")
          git push origin "$COMMIT":refs/heads/data
