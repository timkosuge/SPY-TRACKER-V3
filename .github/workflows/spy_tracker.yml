name: SPY Daily Tracker

on:
  schedule:
    - cron: '0,30 13-20 * * 1-5'
    - cron: '15 22 * * 1-5'
    - cron: '30 13 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-spy-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch database from data branch
        run: |
          git fetch --depth=1 origin data
          git cat-file blob FETCH_HEAD:spy_data.db > spy_data.db

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pytz yfinance pandas market-calendar-tool

      - name: Run SPY tracker
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python fetch_and_analyze.py

      - name: Generate analog data
        run: python generate_analog.py

      - name: Generate time-of-day stats
        run: python generate_tod_stats.py

      - name: Generate expiry data (all trading days)
        run: python generate_expiry_data.py

      - name: Generate intraday patterns
        run: python generate_intraday_patterns.py

      - name: Generate decline/drawdown data
        run: python generate_decline_data.py

      - name: Generate window pattern stats
        run: python generate_window_stats.py

      - name: Generate relief rally data
        run: python generate_relief_data.py

      - name: Push database to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin data
          BLOB=$(git hash-object -w spy_data.db)
          TREE=$(printf '100644 blob %s\tspy_data.db\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -p FETCH_HEAD -m "Auto: spy_data.db $(TZ=America/Chicago date +'%Y-%m-%d %H:%M %Z')")
          git push origin "$COMMIT":refs/heads/data

      - name: Commit updated files
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/
          git add -f spy_data.json market_data.json \
                     analog_data.js tod_stats.js \
                     intraday_library.js expiry_data.js \
                     intraday_patterns.js decline_data.js relief_data.js \
                     window_stats.js gap_stats.js
          git diff --staged --quiet && echo "No changes" || git commit -m "Auto: SPY data update $(TZ=America/Chicago date +'%Y-%m-%d %H:%M %Z')"
          git push || echo "Nothing to push"
