name: SPY Daily Tracker

on:
  schedule:
    - cron: '30 13-21 * * 1-5'
    - cron: '0 14,15 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  fetch-spy-data:
    runs-on: ubuntu-latest
    steps:
      - name: Session clock
        id: clock
        run: |
          MANUAL="${{ github.event_name == 'workflow_dispatch' }}"
          NOW=$(TZ=America/New_York date +%H%M)
          DOW=$(TZ=America/New_York date +%u)
          RUN=false; CLOSE=false
          if [ "$MANUAL" = "true" ]; then RUN=true; CLOSE=true; fi
          if [ "$DOW" -le 5 ] && [ "$NOW" -ge 0925 ] && [ "$NOW" -le 1700 ]; then RUN=true; fi
          MIN=$(TZ=America/New_York date +%M)
          if [ "$MANUAL" != "true" ] && [ "$MIN" -lt 15 ] && { [ "$NOW" -lt 0955 ] || [ "$NOW" -gt 1005 ]; }; then RUN=false; fi
          if [ "$NOW" -ge 1605 ]; then CLOSE=true; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "close=$CLOSE" >> "$GITHUB_OUTPUT"
          echo "New York $NOW, weekday $DOW, run=$RUN close=$CLOSE"

      - name: Checkout repo
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch database from data branch
        if: steps.clock.outputs.run == 'true'
        run: |
          git fetch --depth=1 origin data
          git cat-file blob FETCH_HEAD:spy_data.db > spy_data.db

      - name: Set up Python
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.clock.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Compute S&P 500 breadth
        if: steps.clock.outputs.close == 'true'
        run: python generate_breadth.py

      - name: Fetch Treasury TIC holdings
        if: steps.clock.outputs.close == 'true'
        run: python generate_tic_holdings.py

      - name: Run SPY tracker
        if: steps.clock.outputs.run == 'true'
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python fetch_and_analyze.py

      - name: Generate analog data
        if: steps.clock.outputs.close == 'true'
        run: python generate_analog.py

      - name: Generate time-of-day stats
        if: steps.clock.outputs.run == 'true'
        run: python generate_tod_stats.py

      - name: Generate expiry data (all trading days)
        if: steps.clock.outputs.run == 'true'
        run: python generate_expiry_data.py

      - name: Generate intraday patterns
        if: steps.clock.outputs.run == 'true'
        run: python generate_intraday_patterns.py

      - name: Generate decline/drawdown data
        if: steps.clock.outputs.run == 'true'
        run: python generate_decline_data.py

      - name: Generate window pattern stats
        if: steps.clock.outputs.run == 'true'
        run: python generate_window_stats.py

      - name: Generate relief rally data
        if: steps.clock.outputs.run == 'true'
        run: python generate_relief_data.py

      - name: Generate period aggregates
        if: steps.clock.outputs.run == 'true'
        run: python generate_aggregate_csv.py

      - name: Generate large gap stats
        if: steps.clock.outputs.run == 'true'
        run: python generate_large_gap_stats.py

      - name: Generate release data
        if: steps.clock.outputs.run == 'true'
        run: python generate_release_data.py

      - name: Generate edge stats
        if: steps.clock.outputs.run == 'true'
        run: python generate_edge_stats.py

      - name: Build setup-engine day frame
        if: steps.clock.outputs.run == 'true'
        run: python generate_chains.py

      - name: Build range filter
        if: steps.clock.outputs.run == 'true'
        run: python generate_range_filter.py

      - name: Score strategies
        if: steps.clock.outputs.run == 'true'
        run: python generate_strategies.py

      - name: Measure the clock
        if: steps.clock.outputs.close == 'true'
        run: python generate_clock.py

      - name: Measure the options environment
        if: steps.clock.outputs.run == 'true'
        run: python generate_options_env.py

      - name: Capture positioning and build its history
        if: steps.clock.outputs.close == 'true'
        run: |
          python -c "import fetch_sentiment as fs; fs.store_cot_weeks(fs.fetch_cot_weeks()); fs.fetch_aaii(); fs.store_aaii_weeks(fs.AAII_FULL_SERIES)"
          python generate_cot.py
          python generate_smart_dumb.py

      - name: Data health
        if: steps.clock.outputs.run == 'true'
        run: python generate_health.py

      - name: Snapshot gamma exposure
        if: steps.clock.outputs.run == 'true'
        run: curl -s -o /dev/null -w "gex snapshot HTTP %{http_code}\n" "https://spy-tracker-v3.pages.dev/gex?t=$(date +%s)"

      - name: Push database to data branch
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin data
          BLOB=$(git hash-object -w spy_data.db)
          TREE=$(printf '100644 blob %s\tspy_data.db\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -p FETCH_HEAD -m "Auto: spy_data.db $(TZ=America/Chicago date +'%Y-%m-%d %H:%M %Z')")
          git push origin "$COMMIT":refs/heads/data

      - name: Commit updated files
        if: steps.clock.outputs.run == 'true'
        run: |
          git checkout -- spy_data.db
          git add -f spy_data.json market_data.json \
                     analog_data.js tod_stats.js \
                     intraday_library.js expiry_data.js \
                     intraday_patterns.js decline_data.js relief_data.js \
                     window_stats.js gap_stats.js \
                     session_vol_profile.js intraday_vol_profile.js intraday_vol_stats.js \
                     large_gap_stats.js release_data.js edge_stats_data.js \
                     data/SPY_weekly.csv data/SPY_monthly.csv data/SPY_yearly.csv \
                     breadth_data.json tic_holdings.js health.json chains_data.js range_filter.js strategies_data.js strategies.json clock_data.js options_env.js cot_data.js smart_dumb.js
          if git diff --staged --quiet; then
            echo "No payload changes"
            exit 0
          fi
          git commit -m "Auto: SPY data update $(TZ=America/Chicago date +'%Y-%m-%d %H:%M %Z')"
          git pull --rebase --autostash origin main
          git push
